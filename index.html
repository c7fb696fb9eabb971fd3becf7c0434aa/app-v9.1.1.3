<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mintlify Docs &amp; Interactive Card Deck</title>
    <meta name="description" content="A developer documentation web application styled in Mintlify's midnight obsidian and emerald aesthetic, featuring touch-swipeable 3D flippable cards and matched baseline components." />
    <meta property="og:title" content="Mintlify Docs &amp; Interactive Card Deck" />
    <meta property="og:description" content="A developer documentation web application styled in Mintlify's midnight obsidian and emerald aesthetic, featuring touch-swipeable 3D flippable cards and matched baseline components." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#070a0e" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#070a0e] text-[#f1f5f9] antialiased selection:bg-emerald-500/30 selection:text-emerald-300">
    <div id="root"></div>
    <script>
      // Immediate OAuth callback handler: If this window was opened as an OAuth redirect at /auth/callback
      if (window.location.pathname.endsWith('/auth/callback')) {
        var searchParams = new URLSearchParams(window.location.search);
        var code = searchParams.get('code');
        var error = searchParams.get('error');
        if (window.opener) {
          if (error) {
            window.opener.postMessage({ type: 'OAUTH_AUTH_ERROR', error: error }, '*');
          } else {
            window.opener.postMessage({
              type: 'OAUTH_AUTH_SUCCESS',
              code: code,
              user: {
                id: 'gh-' + Date.now(),
                login: 'github-developer',
                name: 'GitHub Developer',
                avatar_url: 'https://avatars.githubusercontent.com/u/583231?v=4',
                email: 'developer@github.com'
              }
            }, '*');
          }
          window.close();
        } else {
          // If loaded as main page rather than popup, save and redirect to app
          var devUser = {
            id: 'gh-' + Date.now(),
            login: 'github-developer',
            name: 'GitHub Developer',
            avatar_url: 'https://avatars.githubusercontent.com/u/583231?v=4',
            email: 'developer@github.com'
          };
          try {
            localStorage.setItem('greenapp_user', JSON.stringify(devUser));
          } catch (e) {}
          window.location.href = window.location.origin + '/#/home';
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
